services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      DB_PATH: /app/data/bot.sqlite3
    ports:
      - "127.0.0.1:18080:8080"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
