name: Проверка перевода и русское описание v4.9.0
on:
  push:
    branches: ['chore/localize-release-v490']
    paths: ['.github/workflows/localize-release-v490.yml']
permissions:
  contents: write
concurrency:
  group: localize-release-v490
  cancel-in-progress: false
jobs:
  localize:
    if: github.repository == 'cLIcHE-QA/3xui-telegram-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Проверить документацию и перевести существующий релиз без изменения тега
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import collections
          import json
          import os
          import posixpath
          import re
          import urllib.error
          import urllib.parse
          import urllib.request

          BASE = 'https://api.github.com/repos/cLIcHE-QA/3xui-telegram-bot'
          ORIGINAL = '9c9f534fe318ede5aff0885743566362cbfc341a'
          TRANSLATED = '40101eec1125b9b1f7077751b42d9f1403195b92'
          FILES = {'README.md', 'CHANGELOG.md', 'docs/VERSIONS_UPDATES.md', 'docs/GIT_WORKFLOW.md'}
          cache = {}

          def api(path, payload=None):
              request = urllib.request.Request(
                  BASE + path,
                  data=None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': '3xui-documentation-localization',
                  },
                  method='GET' if payload is None else 'PATCH',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  raise RuntimeError(f'GitHub API: HTTP {exc.code} for {path}') from None

          def read(path, ref):
              key = (path, ref)
              if key not in cache:
                  obj = api('/contents/' + urllib.parse.quote(path, safe='/') + '?ref=' + ref)
                  assert obj['type'] == 'file' and obj['encoding'] == 'base64', path
                  cache[key] = base64.b64decode(obj['content']).decode('utf-8')
              return cache[key]

          def blocks(text):
              result, language, lines = [], None, []
              for line in text.splitlines():
                  if line.startswith('```'):
                      if language is None:
                          language, lines = line[3:].strip(), []
                      else:
                          assert line.strip() == '```', 'Invalid closing fence'
                          result.append((language, lines))
                          language = None
                  elif language is not None:
                      lines.append(line)
              assert language is None, 'Unclosed Markdown fence'
              return result

          def executable_blocks(text):
              return [
                  (language, '\n'.join(line.rstrip() for line in lines
                                      if line.strip() and not line.lstrip().startswith('#')))
                  for language, lines in blocks(text)
                  if language in {'bash', 'sh', 'shell', 'env', 'nginx', 'yaml', 'yml', 'python'}
              ]

          def heading_levels(text):
              return [len(match.group(1)) for match in re.finditer(r'^(#{1,6})\s+', text, re.M)]

          def release_versions(text):
              return re.findall(r'^#{1,6}\s+(v\d+(?:\.\d+)*)\b', text, re.M)

          comparison = api('/compare/' + ORIGINAL + '...' + TRANSLATED)
          assert {entry['filename'] for entry in comparison['files']} == FILES, 'Non-documentation changes'
          assert all(entry['status'] == 'modified' for entry in comparison['files'])

          for path in sorted(FILES):
              old, new = read(path, ORIGINAL), read(path, TRANSLATED)
              assert re.search(r'[А-Яа-яЁё]', new.splitlines()[0]), path
              assert executable_blocks(old) == executable_blocks(new), 'Commands changed: ' + path
              if path != 'docs/GIT_WORKFLOW.md':
                  assert heading_levels(old) == heading_levels(new), 'Section structure changed: ' + path
                  assert release_versions(old) == release_versions(new), 'Release history changed: ' + path
                  assert collections.Counter(lang for lang, _ in blocks(old)) == collections.Counter(lang for lang, _ in blocks(new)), 'Code block lost: ' + path
              for link in re.findall(r'\[[^\]]+\]\(([^)]+)\)', new):
                  link = link.split('#', 1)[0]
                  if not link or urllib.parse.urlsplit(link).scheme:
                      continue
                  target = posixpath.normpath(posixpath.join(posixpath.dirname(path), link))
                  assert not target.startswith('../'), 'Invalid link'
                  read(target, TRANSLATED)
              print(f'PASS {path}: Russian heading, executable examples unchanged, Markdown links valid')

          for phrase in ['RESTORE BOT', 'RESTORE XUI', 'RESTORE XUI FORCE', 'RESTORE NODE']:
              assert phrase in read('README.md', TRANSLATED), phrase
          assert 'UNLOCK <operation nonce>' in read('docs/VERSIONS_UPDATES.md', TRANSLATED)
          print('PASS section structure, release history, code-block counts and confirmation phrases')

          tag_before = api('/git/ref/tags/v4.9.0')
          assert tag_before['object']['type'] == 'commit' and tag_before['object']['sha'] == ORIGINAL
          release = api('/releases/394179176')
          assert release['tag_name'] == 'v4.9.0'
          assert not release['draft'] and not release['prerelease']
          assert release['target_commitish'] == ORIGINAL
          name = 'v4.9.0 — Версии и обновления'
          body = '''## Версии и обновления

          - Общий раздел `System → Versions & Updates` и переходы из карточек Master и нод.
          - Ручное обновление 3x-ui по стабильному каналу и выбор конкретной версии Xray, включая понижение версии.
          - Свежая проверенная резервная копия, одноразовое подтверждение с ограниченным сроком действия, проверка прав и целевого сервера, проверка результата без повторной установки.
          - Сохранение неподтверждённых результатов между перезапусками; автоматических повторов, обновлений и отката нет.
          - Использование существующих таблиц аудита и заданий, единый `APP_VERSION` и исправленные версии в манифестах резервных копий.
          - 66 автоматизированных тестов и CI для PR и `main` с правами только на чтение.

          Проверенный запрос на слияние: [PR №1](https://github.com/cLIcHE-QA/3xui-telegram-bot/pull/1).

          Коммит релиза: `9c9f534fe318ede5aff0885743566362cbfc341a`.

          [Успешный CI после слияния](https://github.com/cLIcHE-QA/3xui-telegram-bot/actions/runs/35795363302).

          ## Условия развёртывания

          Этот релиз публикует только исходный код. Рабочий VPS, панель и Xray не обновлялись при его публикации.

          Тесты используют локальные имитации API и временные базы данных. Реальные VPN-подключения необходимо отдельно проверить в период обслуживания.

          Сохрани `.env` и `data/`. Для обновления нод требуется существующее прямое административное подключение из `NODE_BACKUP_TARGETS`.

          Для обновления Master необходим полный проверенный архив. Резервные копии не содержат предыдущие исполняемые файлы.

          Во время обновления не запускай на том же сервере параллельное восстановление, перезапуск или изменение конфигурации.

          Ограничения и восстановление описаны в [руководстве по версиям и обновлениям](https://github.com/cLIcHE-QA/3xui-telegram-bot/blob/main/docs/VERSIONS_UPDATES.md).
          '''
          # Only editable display metadata is patched. No tag, ref, asset or code mutation.
          updated = api('/releases/394179176', {'name': name, 'body': body})
          assert updated['id'] == release['id'] and updated['name'] == name and updated['body'] == body
          for field in ('tag_name', 'target_commitish', 'draft', 'prerelease', 'published_at'):
              assert updated[field] == release[field], field
          assert [item['id'] for item in updated['assets']] == [item['id'] for item in release['assets']]
          assert api('/git/ref/tags/v4.9.0')['object'] == tag_before['object']
          print('PASS release title/body translated; same release ID, tag, commit, publication status and assets')
          print(updated['html_url'])
          PY
