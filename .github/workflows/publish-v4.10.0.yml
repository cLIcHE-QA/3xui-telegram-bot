name: Publish v4.10.0

on:
  push:
    branches:
      - release/v4.10.0-publish
    paths:
      - .github/workflows/publish-v4.10.0.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify immutable release target
        shell: bash
        run: |
          set -euo pipefail
          expected="b1d25d743a8037e59e767dbcfb00fd6b4bcd5299"
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$expected"
          python - <<'PY'
          from version import APP_VERSION
          if APP_VERSION != "4.10.0":
              raise SystemExit(f"APP_VERSION mismatch: {APP_VERSION}")
          PY

      - name: Verify tag and release do not exist
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/v4.10.0" >/dev/null 2>&1; then
            echo "Tag v4.10.0 already exists" >&2
            exit 1
          fi
          if gh release view "v4.10.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v4.10.0 already exists" >&2
            exit 1
          fi

      - name: Create annotated tag
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v4.10.0" "b1d25d743a8037e59e767dbcfb00fd6b4bcd5299" -m "v4.10.0 — Безопасный 3x-ui Control"
          git push origin "refs/tags/v4.10.0"

      - name: Publish stable GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          notes="$RUNNER_TEMP/release-notes.md"
          cat > "$notes" <<'EOF'
          ## v4.10.0 — Безопасный 3x-ui Control

          - Restricted Host Control Agent для status/start/stop/restart x-ui.service.
          - Экран 🧩 3x-ui Control для Master и direct nodes.
          - Штатные Restart Panel process, Stop Xray и Restart / Start Xray.
          - Destructive Stop actions доступны только Owner.
          - Нет SSH/shell/exec/file/Docker/firewall/reboot/package-management API.
          - Agent слушает только 127.0.0.1; remote targets требуют verified HTTPS.
          - Lost-response recovery без automatic mutation retry.
          - Deployment guide: docs/HOST_CONTROL_DEPLOY.md.

          Production deployment не выполняется автоматически.

          Release commit: b1d25d743a8037e59e767dbcfb00fd6b4bcd5299
          EOF
          gh release create "v4.10.0" --repo "$GITHUB_REPOSITORY" --verify-tag --title "v4.10.0 — Безопасный 3x-ui Control" --notes-file "$notes"
