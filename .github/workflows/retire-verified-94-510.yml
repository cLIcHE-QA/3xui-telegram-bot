name: One-time SHA-leased verified 94 refs cleanup #510
on:
  pull_request:
    paths:
      - '.github/workflows/retire-verified-94-510.yml'
      - 'scripts/retire-verified-94-510.py'
      - 'docs/audits/branch-cleanup-verified-94-candidates-2026-10-12.json'
  workflow_run:
    workflows: ['Python checks']
    types: [completed]
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only recheck 94 immutable PR/squash/blob SHA/ownership/dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retire-verified-94-510.py check
  retire-once:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: write
    concurrency:
      group: branch-cleanup-510-verified94
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: SHA-leased ref-only cleanup with fail-closed uncertainty
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          GITHUB_WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python3 scripts/retire-verified-94-510.py execute
