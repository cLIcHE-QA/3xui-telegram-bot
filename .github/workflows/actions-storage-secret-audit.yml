name: Actions storage secret audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan retained Actions logs and artifacts
        env:
          GITHUB_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/scan-github-actions-storage.py \
            --report "$RUNNER_TEMP/actions-storage-audit.json"

      - name: Upload sanitized Actions storage evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: actions-storage-audit-${{ github.sha }}
          path: ${{ runner.temp }}/actions-storage-audit.json
          if-no-files-found: error
          retention-days: 30
