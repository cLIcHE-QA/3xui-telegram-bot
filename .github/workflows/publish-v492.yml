name: Publish verified v4.9.2
on:
  push:
    branches: ['chore/publish-v4.9.2']
    paths: ['.github/workflows/publish-v492.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: publish-v4.9.2
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'cLIcHE-QA/3xui-telegram-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merge CI and create release without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = 'cLIcHE-QA/3xui-telegram-bot'
          SHA = '57c3f04e901899201e248d556981f11189aa9fb9'
          TAG = 'v4.9.2'
          BASE = f'https://api.github.com/repos/{REPO}'

          def api(path, payload=None, allow_missing=False):
              request = urllib.request.Request(
                  BASE + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': '3xui-bot-release-publisher',
                  },
                  method='GET' if payload is None else 'POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if allow_missing and exc.code == 404:
                      return None
                  raise RuntimeError(f'GitHub API request failed: HTTP {exc.code}') from None

          def tag_commit(ref):
              obj = ref['object']
              for _ in range(4):
                  if obj['type'] == 'commit':
                      return obj['sha']
                  if obj['type'] != 'tag':
                      raise RuntimeError('Unexpected tag object type')
                  obj = api('/git/tags/' + obj['sha'])['object']
              raise RuntimeError('Excessive annotated tag indirection')

          if api('/branches/main')['commit']['sha'] != SHA:
              raise RuntimeError('Main moved; release needs another review')

          run = api('/actions/runs/35835577524')
          if (run['head_sha'], run['status'], run['conclusion'], run['event']) != (
                  SHA, 'completed', 'success', 'push'):
              raise RuntimeError('Expected successful post-merge CI is missing')

          pr = api('/pulls/8')
          if not pr['merged'] or pr['merge_commit_sha'] != SHA:
              raise RuntimeError('PR #8 is not merged at the expected commit')

          ref = api('/git/ref/tags/' + TAG, allow_missing=True)
          if ref is not None and tag_commit(ref) != SHA:
              raise RuntimeError('Existing tag points elsewhere; it will NOT be moved')

          release = api('/releases/tags/' + TAG, allow_missing=True)
          if release is None:
              notes = '''## v4.9.2 — Deploy helper и улучшения System/Reality

          - В `System` отображается текущая версия бота из единственного `APP_VERSION`.
          - Reality fingerprint inbound'а выбирается кнопками из актуального списка 3x-ui: `chrome`, `firefox`, `safari`, `ios`, `android`, `edge`, `360`, `qq`, `random`, `randomized`, `randomizednoalpn`, `unsafe`.
          - Произвольный ручной ввод fingerprint из Telegram удалён; остальные Reality/stream settings сохраняются при изменении.
          - Добавлен `scripts/deploy-release.sh` для повторяемого развёртывания опубликованных тегов на VPS.
          - Deploy helper проверяет тег и `APP_VERSION`, текущее здоровье, SQLite, upstream 3x-ui и Docker subnet, создаёт резервную копию, собирает образ и пересоздаёт только сервис `bot`.
          - Helper не выполняет `docker compose down`, `docker system prune`, обновление 3x-ui/Xray или автоматический откат базы.
          - Добавлены `--status`, защита от случайного downgrade и CI-проверки deploy helper.
          - Схема SQLite и логика подписок не изменены.

          Основные PR:
          - PR #6 — стандартный deploy helper.
          - PR #7 — версия бота в System и Reality fingerprint кнопками.
          - PR #8 — release prep v4.9.2.

          Коммит релиза: 57c3f04e901899201e248d556981f11189aa9fb9
          Post-merge CI: https://github.com/cLIcHE-QA/3xui-telegram-bot/actions/runs/35835577524

          ## Первое развёртывание helper

          Production v4.9.1 был опубликован до появления `scripts/deploy-release.sh`. Поэтому переход на v4.9.2 требует одноразового bootstrap helper из `origin/main`, как описано в `docs/GIT_WORKFLOW.md`.

          После установки v4.9.2 следующие релизы обновляются обычной командой:

          ```bash
          cd /opt/3xui-bot/3xui-telegram-bot
          ./scripts/deploy-release.sh vX.Y.Z
          ```

          После развёртывания проверь `./scripts/deploy-release.sh --status`, реальную подписку и `/admin → System`.
          '''

              release = api('/releases', {
                  'tag_name': TAG,
                  'target_commitish': SHA,
                  'name': 'v4.9.2 — Deploy helper и улучшения System/Reality',
                  'body': notes,
                  'draft': False,
                  'prerelease': False,
                  'make_latest': 'true',
              })

          if release['draft'] or release['prerelease']:
              raise RuntimeError('Existing release is not the expected published stable release')

          ref = api('/git/ref/tags/' + TAG)
          if tag_commit(ref) != SHA:
              raise RuntimeError('Published tag did not match the reviewed commit')

          print('Verified release:', release['html_url'])
          print('Verified tag:', TAG, SHA)
          PY
