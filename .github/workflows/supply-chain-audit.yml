name: Supply-chain audit

on:
  push:
    branches:
      - main
    paths:
      - requirements.txt
      - requirements.lock
      - Dockerfile
      - supply-chain/**
      - .github/workflows/**
  pull_request:
    paths:
      - requirements.txt
      - requirements.lock
      - Dockerfile
      - supply-chain/**
      - .github/workflows/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      AUDIT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.AUDIT_SOURCE_SHA }}
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Verify hashed Python lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --require-hashes -r requirements.lock
          python -m pip check

      - name: Install pinned Trivy
        shell: bash
        run: |
          set -Eeuo pipefail
          version="0.75.0"
          archive="trivy_0.75.0_Linux-64bit.tar.gz"
          url="https://github.com/aquasecurity/trivy/releases/download/v${version}/${archive}"
          expected="c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f"

          curl --fail --location --silent --show-error "$url" -o "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$expected" "$RUNNER_TEMP/$archive" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" trivy
          chmod 0755 "$RUNNER_TEMP/trivy"
          "$RUNNER_TEMP/trivy" --version

      - name: Scan Python dependency vulnerabilities and licenses
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p "$RUNNER_TEMP/supply-chain-audit"

          "$RUNNER_TEMP/trivy" fs             --scanners vuln             --format json             --output "$RUNNER_TEMP/supply-chain-audit/python-vulnerabilities.json"             .

          "$RUNNER_TEMP/trivy" fs             --scanners license             --format json             --output "$RUNNER_TEMP/supply-chain-audit/python-licenses.json"             .

      - name: Build audited container image
        shell: bash
        run: |
          set -Eeuo pipefail
          docker build --pull=false -t "3xui-telegram-bot:audit-${AUDIT_SOURCE_SHA}" .

      - name: Scan image and generate CycloneDX SBOM
        shell: bash
        run: |
          set -Eeuo pipefail
          image="3xui-telegram-bot:audit-${AUDIT_SOURCE_SHA}"

          "$RUNNER_TEMP/trivy" image             --scanners vuln             --format json             --output "$RUNNER_TEMP/supply-chain-audit/container-vulnerabilities.json"             "$image"

          "$RUNNER_TEMP/trivy" image             --scanners license             --format json             --output "$RUNNER_TEMP/supply-chain-audit/container-licenses.json"             "$image"

          "$RUNNER_TEMP/trivy" image             --format cyclonedx             --output "$RUNNER_TEMP/supply-chain-audit/container-sbom.cdx.json"             "$image"

      - name: Write audit metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess

          out = Path(os.environ["RUNNER_TEMP"]) / "supply-chain-audit"
          base = Path("supply-chain/base-image.txt").read_text(encoding="utf-8").strip()
          lock = Path("requirements.lock").read_bytes()
          trivy_version = subprocess.check_output(
              [str(Path(os.environ["RUNNER_TEMP"]) / "trivy"), "--version"],
              text=True,
          ).splitlines()[0].strip()
          payload = {
              "source_sha": os.environ["AUDIT_SOURCE_SHA"],
              "base_image": base,
              "requirements_lock_sha256": hashlib.sha256(lock).hexdigest(),
              "trivy": trivy_version,
              "trivy_linux_64bit_sha256": "c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f",
              "actions": {
                  "checkout": "11d5960a326750d5838078e36cf38b85af677262",
                  "setup-python": "a26af69be951a213d495a4c3e4e4022e16d87065",
                  "upload-artifact": "ea165f8d65b6e75b540449e92b4886f43607fa02",
              },
          }
          (out / "metadata.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Gate actionable HIGH/CRITICAL vulnerabilities
        shell: bash
        run: |
          set -Eeuo pipefail

          "$RUNNER_TEMP/trivy" fs \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --quiet \
            .

          "$RUNNER_TEMP/trivy" image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            --quiet \
            "3xui-telegram-bot:audit-${AUDIT_SOURCE_SHA}"

      - name: Upload supply-chain audit evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: supply-chain-audit-${{ env.AUDIT_SOURCE_SHA }}
          path: ${{ runner.temp }}/supply-chain-audit/
          if-no-files-found: error
          retention-days: 30
