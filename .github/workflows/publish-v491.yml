name: Publish verified v4.9.1
on:
  push:
    branches: ['chore/publish-v4.9.1']
    paths: ['.github/workflows/publish-v491.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: publish-v4.9.1
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'cLIcHE-QA/3xui-telegram-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify merge CI and create release without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = 'cLIcHE-QA/3xui-telegram-bot'
          SHA = 'eeb778e2cf879ea0073056332c12c54ccc7635f4'
          TAG = 'v4.9.1'
          BASE = f'https://api.github.com/repos/{REPO}'

          def api(path, payload=None, allow_missing=False):
              request = urllib.request.Request(
                  BASE + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': '3xui-bot-release-publisher',
                  },
                  method='GET' if payload is None else 'POST',
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      return json.load(response)
              except urllib.error.HTTPError as exc:
                  if allow_missing and exc.code == 404:
                      return None
                  raise RuntimeError(f'GitHub API request failed: HTTP {exc.code}') from None

          def tag_commit(ref):
              obj = ref['object']
              for _ in range(4):
                  if obj['type'] == 'commit':
                      return obj['sha']
                  if obj['type'] != 'tag':
                      raise RuntimeError('Unexpected tag object type')
                  obj = api('/git/tags/' + obj['sha'])['object']
              raise RuntimeError('Excessive annotated tag indirection')

          if api('/branches/main')['commit']['sha'] != SHA:
              raise RuntimeError('Main moved; release needs another review')

          run = api('/actions/runs/35830099873')
          if (run['head_sha'], run['status'], run['conclusion'], run['event']) != (
                  SHA, 'completed', 'success', 'push'):
              raise RuntimeError('Expected successful post-merge CI is missing')

          pr = api('/pulls/5')
          if not pr['merged'] or pr['merge_commit_sha'] != SHA:
              raise RuntimeError('PR #5 is not merged at the expected commit')

          ref = api('/git/ref/tags/' + TAG, allow_missing=True)
          if ref is not None and tag_commit(ref) != SHA:
              raise RuntimeError('Existing tag points elsewhere; it will NOT be moved')

          release = api('/releases/tags/' + TAG, allow_missing=True)
          if release is None:
              notes = '''## Стабилизация сети и интерфейса

          - Docker-подсеть проекта закреплена через `BOT_DOCKER_SUBNET` с дефолтом `172.19.0.0/16`, чтобы пересоздание Compose-сети не меняло источник трафика к локальной панели 3x-ui.
          - Документация фиксирует необходимость синхронизировать UFW-правило порта панели с выбранной Docker-подсетью.
          - CI проверяет `docker compose config` на основе `.env.example`.
          - Навигация `Versions & Updates` приведена к общему стилю административной панели.
          - Статические inline-кнопки пользовательского и административного интерфейса используют emoji или навигационный символ; это правило дополнительно проверяется CI.
          - Схема SQLite, API-контракты 3x-ui, логика подписок и механизм обновления 3x-ui/Xray не изменены.

          Изменения: PR #3, PR #4.
          Подготовка релиза: PR #5.
          Коммит релиза: eeb778e2cf879ea0073056332c12c54ccc7635f4
          Post-merge CI: https://github.com/cLIcHE-QA/3xui-telegram-bot/actions/runs/35830099873

          ## Условия развёртывания

          Публикация релиза сама по себе не обновляет рабочий VPS.
          Перед развёртыванием сохрани `.env` и `data/` и проверь доступ контейнера к 3x-ui.
          Для стандартной подсети `172.19.0.0/16` правило UFW на порт панели должно разрешать трафик от этой Docker-подсети.
          После развёртывания проверь `/healthz`, SQLite `PRAGMA quick_check`, подписки и раздел `System → Versions & Updates`.
          '''

              release = api('/releases', {
                  'tag_name': TAG,
                  'target_commitish': SHA,
                  'name': 'v4.9.1 — Стабилизация сети и интерфейса',
                  'body': notes,
                  'draft': False,
                  'prerelease': False,
                  'make_latest': 'true',
              })

          if release['draft'] or release['prerelease']:
              raise RuntimeError('Existing release is not the expected published stable release')

          ref = api('/git/ref/tags/' + TAG)
          if tag_commit(ref) != SHA:
              raise RuntimeError('Published tag did not match the reviewed commit')

          print('Verified release:', release['html_url'])
          print('Verified tag:', TAG, SHA)
          PY
