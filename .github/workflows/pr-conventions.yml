name: PR conventions

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  title:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PR_TITLE: ${{ github.event.pull_request.title }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate PR checklist
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 scripts/check_pr_checklist.py
      - name: Validate PR title
        shell: bash
        run: |
          set -Eeuo pipefail

          release_re='^release: v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'
          regular_re='^(feat|fix|security|docs|test|chore|refactor): .+'

          if [[ "$PR_TITLE" =~ $release_re ]]; then
            exit 0
          fi

          if [[ "$PR_TITLE" =~ $regular_re ]]; then
            exit 0
          fi

          cat >&2 <<'EOF'
          Invalid PR title.

          Expected:
            feat: <краткое описание>
            fix: <краткое описание>
            security: <краткое описание>
            docs: <краткое описание>
            test: <краткое описание>
            chore: <краткое описание>
            refactor: <краткое описание>
            release: vX.Y.Z[-rc.N]
          EOF
          exit 1
