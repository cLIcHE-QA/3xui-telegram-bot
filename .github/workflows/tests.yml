name: Python checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: python3 scripts/check-3xui-openapi-contract.py
      - run: |
          python3 scripts/render-release-notes.py --help >/dev/null
          python3 scripts/render-release-notes.py \
            --version 4.11.0 \
            --commit 104a17ec1f797b971b74d33dacd3febf93f66fb6 \
            --title-out /tmp/release-title.txt \
            --body-out /tmp/release-body.md
          grep -qx 'v4.11.0 — Node readiness и безопасный onboarding' /tmp/release-title.txt
          grep -q 'deploy-release.sh v4.11.0' /tmp/release-body.md
          grep -q 'contents: write' .github/workflows/release.yml
      - run: |
          test -x scripts/deploy-release.sh
          bash -n scripts/deploy-release.sh
          scripts/deploy-release.sh --help >/dev/null
      - run: |
          test -x scripts/install-host-control-agent.sh
          sh -n scripts/install-host-control-agent.sh
          sudo /usr/sbin/visudo -cf deploy/host-control/3xui-host-control.sudoers >/dev/null
      - run: |
          test -x scripts/setup-host-control-endpoint.sh
          bash -n scripts/setup-host-control-endpoint.sh
          scripts/setup-host-control-endpoint.sh --help >/dev/null
          test -x scripts/build-host-control-bundle.sh
          bash -n scripts/build-host-control-bundle.sh
          scripts/build-host-control-bundle.sh --help >/dev/null
          test -x scripts/refresh-host-control-tls.sh
          bash -n scripts/refresh-host-control-tls.sh
          test -x scripts/import-host-control-enrollment.py
          python3 scripts/import-host-control-enrollment.py --help >/dev/null
          test -x scripts/import-node-admin-target.py
          python3 scripts/import-node-admin-target.py --help >/dev/null
          test -x scripts/onboard-node.py
          python3 scripts/onboard-node.py --help >/dev/null
          test -f scripts/onboard-direct-node.sh
          bash -n scripts/onboard-direct-node.sh
          bash scripts/onboard-direct-node.sh --help >/dev/null
      - run: |
          test -x scripts/3xui-bot-deploy-helper.sh
          bash -n scripts/3xui-bot-deploy-helper.sh
          test -x scripts/install-deploy-agent.sh
          sh -n scripts/install-deploy-agent.sh
          sudo /usr/sbin/visudo -cf deploy/deploy-agent/3xui-deploy-agent.sudoers >/dev/null
          grep -q '^User=3xui-deploy          grep -q 'OFFSITE_BACKUP_ENABLED=false' .env.example
          grep -q 'OFFSITE_BACKUP_ENCRYPTION_KEY_B64=' .env.example
      - run: |
          test -x scripts/bootstrap-bot-from-backup.sh
          bash -n scripts/bootstrap-bot-from-backup.sh
          scripts/bootstrap-bot-from-backup.sh --help 2>&1 | grep -q 'RECOVERY_ALLOW_VERSION_MISMATCH'
          grep -q 'NODE_BACKUP_TARGETS' scripts/bootstrap-bot-from-backup.sh
          grep -q 'deploy-release.sh --status' scripts/bootstrap-bot-from-backup.sh
          set +e
          scripts/bootstrap-bot-from-backup.sh >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
      - run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - run: git diff --check
 deploy/deploy-agent/3xui-deploy-agent.service
          grep -q '^ProtectSystem=strict          grep -q 'OFFSITE_BACKUP_ENABLED=false' .env.example
          grep -q 'OFFSITE_BACKUP_ENCRYPTION_KEY_B64=' .env.example
      - run: |
          test -x scripts/bootstrap-bot-from-backup.sh
          bash -n scripts/bootstrap-bot-from-backup.sh
          scripts/bootstrap-bot-from-backup.sh --help 2>&1 | grep -q 'RECOVERY_ALLOW_VERSION_MISMATCH'
          grep -q 'NODE_BACKUP_TARGETS' scripts/bootstrap-bot-from-backup.sh
          grep -q 'deploy-release.sh --status' scripts/bootstrap-bot-from-backup.sh
          set +e
          scripts/bootstrap-bot-from-backup.sh >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
      - run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - run: git diff --check
 deploy/deploy-agent/3xui-deploy-agent.service
          grep -q 'DEPLOY_AGENT_URL=' .env.example
          grep -q 'DEPLOY_AGENT_TOKEN=' .env.example
          ! grep -q '/var/run/docker.sock' docker-compose.yml
      - run: |
          python3 scripts/fetch-offsite-backup.py --help >/dev/null
          grep -q 'OFFSITE_BACKUP_ENABLED=false' .env.example
          grep -q 'OFFSITE_BACKUP_ENCRYPTION_KEY_B64=' .env.example
      - run: |
          test -x scripts/bootstrap-bot-from-backup.sh
          bash -n scripts/bootstrap-bot-from-backup.sh
          scripts/bootstrap-bot-from-backup.sh --help 2>&1 | grep -q 'RECOVERY_ALLOW_VERSION_MISMATCH'
          grep -q 'NODE_BACKUP_TARGETS' scripts/bootstrap-bot-from-backup.sh
          grep -q 'deploy-release.sh --status' scripts/bootstrap-bot-from-backup.sh
          set +e
          scripts/bootstrap-bot-from-backup.sh >/dev/null 2>&1
          rc=$?
          set -e
          test "$rc" -eq 2
      - run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - run: git diff --check
