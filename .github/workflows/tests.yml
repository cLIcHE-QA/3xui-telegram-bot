name: Python checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: |
          test -x scripts/deploy-release.sh
          bash -n scripts/deploy-release.sh
          scripts/deploy-release.sh --help >/dev/null
      - run: |
          test -x scripts/install-host-control-agent.sh
          sh -n scripts/install-host-control-agent.sh
          sudo /usr/sbin/visudo -cf deploy/host-control/3xui-host-control.sudoers >/dev/null
      - run: |
          cp .env.example .env
          docker compose --env-file .env.example config --quiet
      - run: git diff --check
