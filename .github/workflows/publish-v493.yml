name: Publish verified v4.9.3
on:
  push:
    branches: ['chore/publish-v4.9.3']
    paths: ['.github/workflows/publish-v493.yml']
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: publish-v4.9.3
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'cLIcHE-QA/3xui-telegram-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify release inputs and publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          REPO = 'cLIcHE-QA/3xui-telegram-bot'
          SHA = 'ce1e660463e0bc7d05e78f0d28caf44d4d6c3a15'
          TAG = 'v4.9.3'
          BASE = f'https://api.github.com/repos/{REPO}'

          def api(path, payload=None, allow_missing=False):
              req = urllib.request.Request(
                  BASE + path,
                  data=None if payload is None else json.dumps(payload).encode(),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'User-Agent': '3xui-bot-release-publisher',
                  },
                  method='GET' if payload is None else 'POST',
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      return json.load(resp)
              except urllib.error.HTTPError as exc:
                  if allow_missing and exc.code == 404:
                      return None
                  raise RuntimeError(f'GitHub API request failed: HTTP {exc.code}') from None

          def tag_commit(ref):
              obj = ref['object']
              for _ in range(4):
                  if obj['type'] == 'commit':
                      return obj['sha']
                  if obj['type'] != 'tag':
                      raise RuntimeError('Unexpected tag object type')
                  obj = api('/git/tags/' + obj['sha'])['object']
              raise RuntimeError('Excessive annotated tag indirection')

          if api('/branches/main')['commit']['sha'] != SHA:
              raise RuntimeError('Main moved; release needs another review')

          run = api('/actions/runs/35895691401')
          if (run['head_sha'], run['status'], run['conclusion'], run['event']) != (
                  SHA, 'completed', 'success', 'push'):
              raise RuntimeError('Expected successful post-merge CI is missing')

          pr = api('/pulls/10')
          if not pr['merged'] or pr['merge_commit_sha'] != SHA:
              raise RuntimeError('PR #10 is not merged at the expected commit')

          ref = api('/git/ref/tags/' + TAG)
          if tag_commit(ref) != SHA:
              raise RuntimeError('Tag does not point to the reviewed release commit')

          release = api('/releases/tags/' + TAG, allow_missing=True)
          if release is None:
              notes = '''## v4.9.3 — Исправление счётчиков карточки ноды

          - Карточка `Infrastructure → Nodes → <node>` теперь использует enriched-данные `/panel/api/nodes/list` для вычисляемых счётчиков `inboundCount`, `clientCount`, `activeCount` и `onlineCount`.
          - Исправлена ситуация, когда рабочая удалённая нода с синхронизированными inbound'ами и реальным VPN-трафиком показывала `Inbound'ов: 0` и `Клиентов: 0`.
          - При недоступности list API или отсутствии нужной ноды сохраняется fallback на `/panel/api/nodes/get/{id}`, поэтому административные действия не блокируются.
          - Схема SQLite, provisioning, подписки, direct admin target, Backup и Versions & Updates не изменены.

          Основные PR:
          - PR #9 — исправление enriched counters карточки ноды.
          - PR #10 — release prep v4.9.3.

          Коммит релиза: ce1e660463e0bc7d05e78f0d28caf44d4d6c3a15
          Post-merge CI: https://github.com/cLIcHE-QA/3xui-telegram-bot/actions/runs/35895691401

          После публикации production обновляется стандартным helper:

          ```bash
          cd /opt/3xui-bot/3xui-telegram-bot
          ./scripts/deploy-release.sh v4.9.3
          ```

          После развёртывания проверь `./scripts/deploy-release.sh --status` и карточку Finland: `Inbound'ов`, `Клиентов`, `active`, `online`.
          '''

              release = api('/releases', {
                  'tag_name': TAG,
                  'target_commitish': SHA,
                  'name': 'v4.9.3 — Исправление счётчиков карточки ноды',
                  'body': notes,
                  'draft': False,
                  'prerelease': False,
                  'make_latest': 'true',
              })

          if release['draft'] or release['prerelease']:
              raise RuntimeError('Release is not the expected stable published release')

          ref = api('/git/ref/tags/' + TAG)
          if tag_commit(ref) != SHA:
              raise RuntimeError('Published release tag moved unexpectedly')

          print('Verified release:', release['html_url'])
          print('Verified tag:', TAG, SHA)
          PY
