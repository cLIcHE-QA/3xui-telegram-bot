name: One-time SHA-leased historical 9 release refs cleanup #510
on:
  pull_request:
    paths:
      - '.github/workflows/retire-release-9-510.yml'
      - 'scripts/retire-release-9-510.py'
      - 'docs/audits/branch-cleanup-release-9-verified-2026-10-12.json'
  workflow_run:
    workflows: ['Python checks']
    types: [completed]
permissions:
  contents: read
jobs:
  preflight:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Read-only exact-SHA/PR/squash/blob/ancestry/dependency preflight
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/retire-release-9-510.py check
  retire-once:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    concurrency:
      group: branch-cleanup-510-release9
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: One-shot SHA-leased deletion with fail-closed read-back
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_WORKFLOW_RUN_SHA: ${{ github.event.workflow_run.head_sha }}
          GITHUB_WORKFLOW_RUN_EVENT: ${{ github.event.workflow_run.event }}
          GITHUB_WORKFLOW_RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: python3 scripts/retire-release-9-510.py execute
