name: History secret audit

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run full-history secret audit
        shell: bash
        run: |
          set -Eeuo pipefail
          bash scripts/run-history-secret-audit.sh "$RUNNER_TEMP/history-secret-audit"

      - name: Upload sanitized audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: history-secret-audit-${{ github.sha }}
          path: |
            ${{ runner.temp }}/history-secret-audit/gitleaks-safe.json
            ${{ runner.temp }}/history-secret-audit/history-metadata.json
          if-no-files-found: error
          retention-days: 30
