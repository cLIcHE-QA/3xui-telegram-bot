name: Roadmap GitHub reconciliation

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 1"

permissions:
  contents: read
  issues: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Read-only GitHub Issue and Release reconciliation
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/check-roadmap-github.py --repository "$GITHUB_REPOSITORY"
