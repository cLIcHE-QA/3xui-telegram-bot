name: Subscription Page D1a checks
on:
  pull_request:
    paths:
      - 'web/subscription-page/**'
      - 'subscription_page_config.py'
      - 'tests/test_subscription_page_config.py'
      - '.github/workflows/subscription-page-d1a.yml'
  push:
    branches: [main]
    paths:
      - 'web/subscription-page/**'
      - 'subscription_page_config.py'
      - 'tests/test_subscription_page_config.py'
permissions:
  contents: read
jobs:
  frontend-model:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate isolated TypeScript import model
        working-directory: web/subscription-page
        run: node --experimental-strip-types --test src/model.test.ts
      - name: Compile standalone React TypeScript preview
        working-directory: web/subscription-page
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm run build
      - name: Check no user configuration committed
        run: |
          ! git ls-files | grep -E '(^|/)(subpage-[0-9a-f-]+\.json|\.env$|node_modules/)'
