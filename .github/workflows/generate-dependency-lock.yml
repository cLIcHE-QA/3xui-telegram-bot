name: Generate dependency lock

on:
  push:
    branches:
      - security/supply-chain-baseline
    paths:
      - requirements.txt
      - .github/workflows/generate-dependency-lock.yml

permissions:
  contents: write

jobs:
  lock:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Generate hashed lock
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --disable-pip-version-check pip-tools==7.6.1
          python -m piptools compile             --resolver=backtracking             --generate-hashes             --strip-extras             --output-file requirements.lock             requirements.txt
          python -m pip install --require-hashes -r requirements.lock
      - name: Resolve immutable Python base digest
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p supply-chain
          digest="$(docker buildx imagetools inspect python:3.12-slim | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'python:3.12-slim@%s\n' "$digest" > supply-chain/base-image.txt

      - name: Commit generated lock and base digest
        shell: bash
        run: |
          set -Eeuo pipefail
          git add requirements.lock supply-chain/base-image.txt
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "chore: generate hashed dependency lock"
          git push origin HEAD:security/supply-chain-baseline
