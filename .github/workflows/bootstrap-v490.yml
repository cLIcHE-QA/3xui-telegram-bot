name: Integrate v4.9.0 on feature branch
on:
  push:
    branches: [feature/versions-updates]
    paths: [scripts/integrate_v490.py, .github/workflows/bootstrap-v490.yml]
permissions:
  contents: write
jobs:
  integrate:
    if: github.repository == 'cLIcHE-QA/3xui-telegram-bot' && github.ref == 'refs/heads/feature/versions-updates'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python scripts/integrate_v490.py
      - run: python -m compileall -q .
      - run: python -m unittest discover -s tests -v
      - run: git diff --check
      - name: Commit verified integration to feature branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/feature/versions-updates | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add xui.py bot.py admin_auth.py admin_observability.py advanced_nodes.py backup_manager.py system_backup.py README.md CHANGELOG.md .dockerignore
          git commit -m 'feat: integrate v4.9.0 version management after tests'
          git push origin HEAD:refs/heads/feature/versions-updates
