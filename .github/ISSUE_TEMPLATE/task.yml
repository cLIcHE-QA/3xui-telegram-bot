name: Task
description: Operational, maintenance или documentation задача
title: "task: "
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability? Do not use this public issue form.**
        Open the repository Security policy and use **Security → Advisories → Report a vulnerability** when private vulnerability reporting is enabled. Never paste credentials, private keys, subscription URLs/IDs, production DBs/backups, or exploit details here.
  - type: textarea
    id: outcome
    attributes:
      label: Результат
      description: Какой конкретный результат должен быть получен?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: Что входит и не входит в задачу?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
