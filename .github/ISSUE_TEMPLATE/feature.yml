name: Feature
description: Предложить новую возможность
title: "feature: "
body:
  - type: markdown
    attributes:
      value: |
        **Security vulnerability? Do not use this public issue form.**
        Open the repository Security policy and use **Security → Advisories → Report a vulnerability** when private vulnerability reporting is enabled. Never paste credentials, private keys, subscription URLs/IDs, production DBs/backups, or exploit details here.
  - type: textarea
    id: outcome
    attributes:
      label: Желаемый результат
      description: Что должно стать возможным после реализации?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Зачем это нужно и какой текущий flow затрагивается?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: Совместимость / security
      description: Migration, privilege boundary, rollout или другие ограничения.
